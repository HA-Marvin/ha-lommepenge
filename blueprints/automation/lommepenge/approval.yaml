blueprint:
  name: Lommepenge – approve via notification
  description: >
    Sends a notification with Approve/Reject buttons to the parents' phones
    when a child has marked a task as done. Only taps from the selected
    parents are carried out. When the task is decided (here or in the app),
    the notification disappears for everyone. The notification text comes
    from the integration in the language chosen for it; the button labels
    can be changed below.
  domain: automation
  source_url: https://raw.githubusercontent.com/HA-Marvin/ha-lommepenge/main/blueprints/automation/lommepenge/approval.yaml
  input:
    notify_services:
      name: The parents' notify services
      description: >
        One per line, e.g. notify.mobile_app_pixel_8 (found under
        Developer tools → Actions).
      selector:
        text:
          multiple: true
    parents:
      name: Parents who may approve
      description: Only taps from these people's HA users are carried out.
      selector:
        entity:
          filter:
            - domain: person
          multiple: true
    approve_label:
      name: Label of the approve button
      default: Approve
      selector:
        text:
    reject_label:
      name: Label of the reject button
      default: Reject
      selector:
        text:

mode: queued
max: 25

variables:
  notify_services: !input notify_services
  parents: !input parents
  approve_label: !input approve_label
  reject_label: !input reject_label
  parent_user_ids: >
    {{ parents | map('state_attr', 'user_id') | select('string') | list }}

triggers:
  - trigger: event
    event_type: lommepenge_event
    event_data:
      event: completion_pending
    id: new
  - trigger: event
    event_type: lommepenge_event
    event_data:
      event: completion_approved
    id: decided
  - trigger: event
    event_type: lommepenge_event
    event_data:
      event: completion_rejected
    id: decided
  - trigger: event
    event_type: mobile_app_notification_action
    id: answer

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: new
        sequence:
          - variables:
              cid: "{{ trigger.event.data.completionId }}"
              msg: >
                {{ trigger.event.data.message
                   or (trigger.event.data.childName ~ ': ' ~ trigger.event.data.taskTitle) }}
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: Lommepenge
                    message: "{{ msg }}"
                    data:
                      tag: "lommepenge_{{ cid }}"
                      actions:
                        - action: "LOMMEPENGE_APPROVE_{{ cid }}"
                          title: "{{ approve_label }}"
                        - action: "LOMMEPENGE_REJECT_{{ cid }}"
                          title: "{{ reject_label }}"

      - conditions:
          - condition: trigger
            id: decided
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "lommepenge_{{ trigger.event.data.completionId }}"

      - conditions:
          - condition: trigger
            id: answer
          - condition: template
            value_template: >
              {% set a = trigger.event.data.action | default('') %}
              {{ a.startswith('LOMMEPENGE_APPROVE_') or a.startswith('LOMMEPENGE_REJECT_') }}
          - condition: template
            value_template: "{{ trigger.event.context.user_id in parent_user_ids }}"
        sequence:
          - variables:
              parts: "{{ trigger.event.data.action.split('_', 2) }}"
          - action: >
              {{ 'lommepenge.approve' if parts[1] == 'APPROVE' else 'lommepenge.reject' }}
            data:
              completion_id: "{{ parts[2] }}"
