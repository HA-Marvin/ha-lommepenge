blueprint:
  name: Lommepenge – restrict tablet on overdue task
  description: >
    Turns on a switch (e.g. a UniFi traffic rule that blocks YouTube/games
    for the child's tablet) while the child has an overdue mandatory task,
    and turns it off again when the task is marked as done. If Lommepenge is
    unavailable for more than 10 minutes, the switch is turned off, so a
    fault never punishes the child. Create one automation per child. The
    reason in the notification comes from the integration in the language
    chosen for it; the other texts can be changed below.
  domain: automation
  source_url: https://raw.githubusercontent.com/HA-Marvin/ha-lommepenge/main/blueprints/automation/lommepenge/restriction.yaml
  input:
    restricted_sensor:
      name: The child's "Tablet restricted" sensor
      selector:
        entity:
          filter:
            - integration: lommepenge
              domain: binary_sensor
    block_switch:
      name: Switch that restricts the tablet
      description: >
        On = restricted. E.g. the UniFi integration's switch for a traffic
        rule that blocks entertainment for exactly this tablet.
      selector:
        entity:
          filter:
            - domain: switch
    notify_services:
      name: The parents' notify services (optional)
      description: >
        Notified when the tablet is restricted, with a button to lift the
        restriction for today. One per line, e.g. notify.mobile_app_pixel_8.
      default: []
      selector:
        text:
          multiple: true
    parents:
      name: Parents who may lift the restriction (optional)
      default: []
      selector:
        entity:
          filter:
            - domain: person
          multiple: true
    texts:
      name: Notification texts
      description: "{{ child_name }} is replaced by the child's name."
      collapsed: true
      input:
        restricted_title:
          name: Title when the tablet is restricted
          default: "{{ child_name }}'s tablet is restricted"
          selector:
            text:
        fallback_reason:
          name: Text when no reason is given
          default: Overdue task
          selector:
            text:
        suspend_label:
          name: Label of the button that lifts the restriction
          default: Lift restriction today
          selector:
            text:
        unavailable_title:
          name: Title when Lommepenge is not responding
          default: Lommepenge is not responding
          selector:
            text:
        unavailable_message:
          name: Message when Lommepenge is not responding
          default: >-
            Lommepenge has been unavailable for 10 minutes, so {{ child_name }}'s
            tablet has been unlocked.
          selector:
            text:
              multiline: true

mode: queued
max: 10

variables:
  restricted_sensor: !input restricted_sensor
  notify_services: !input notify_services
  parents: !input parents
  parent_user_ids: >
    {{ parents | map('state_attr', 'user_id') | select('string') | list }}
  child_id: "{{ state_attr(restricted_sensor, 'child_id') }}"
  child_name: "{{ state_attr(restricted_sensor, 'child_name') or 'The child' }}"
  tag: "lommepenge_restriction_{{ child_id }}"
  restricted_title: !input restricted_title
  fallback_reason: !input fallback_reason
  suspend_label: !input suspend_label
  unavailable_title: !input unavailable_title
  unavailable_message: !input unavailable_message

triggers:
  - trigger: state
    entity_id: !input restricted_sensor
    to: "on"
    id: restrict
  - trigger: state
    entity_id: !input restricted_sensor
    to: "off"
    id: lift
  - trigger: state
    entity_id: !input restricted_sensor
    to: "unavailable"
    for: "00:10:00"
    id: unavailable
  - trigger: homeassistant
    event: start
    id: start
  - trigger: event
    event_type: mobile_app_notification_action
    id: button

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: restrict
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input block_switch
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ restricted_title }}"
                    message: "{{ state_attr(restricted_sensor, 'reason') or fallback_reason }}"
                    data:
                      tag: "{{ tag }}"
                      actions:
                        - action: "LOMMEPENGE_SUSPEND_{{ child_id }}"
                          title: "{{ suspend_label }}"

      - conditions:
          - condition: trigger
            id: lift
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input block_switch
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"

      - conditions:
          - condition: trigger
            id: unavailable
        sequence:
          # Fail-open: a fault in the system must never punish the child.
          - action: switch.turn_off
            target:
              entity_id: !input block_switch
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ unavailable_title }}"
                    message: "{{ unavailable_message }}"

      - conditions:
          - condition: trigger
            id: start
        sequence:
          - action: >
              switch.turn_{{ 'on' if is_state(restricted_sensor, 'on') else 'off' }}
            target:
              entity_id: !input block_switch

      - conditions:
          - condition: trigger
            id: button
          - condition: template
            value_template: >
              {{ child_id and trigger.event.data.action | default('')
                 == 'LOMMEPENGE_SUSPEND_' ~ child_id }}
          - condition: template
            value_template: "{{ trigger.event.context.user_id in parent_user_ids }}"
        sequence:
          - action: lommepenge.suspend_restriction
            data:
              child_id: "{{ child_id }}"
