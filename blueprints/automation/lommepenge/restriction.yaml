blueprint:
  name: Lommepenge – restrict tablet while locked
  description: >
    Turns on a switch (e.g. a UniFi traffic rule that blocks YouTube/games
    for the child's tablet) exactly while the child's lock runs, and turns it
    off again when the lock ends or a parent lifts it. Lommepenge decides when
    a lock starts (an overdue or rejected mandatory task, once the child uses
    the tablet) and how long it lasts. Parents are not notified; locks are in
    the app's history. The switch follows the sensor again when Home
    Assistant starts. If Lommepenge is unavailable for more than 10 minutes,
    the switch is turned off, so a fault never punishes the child. Create one
    automation per child.
  domain: automation
  source_url: https://raw.githubusercontent.com/HA-Marvin/ha-lommepenge/main/blueprints/automation/lommepenge/restriction.yaml
  input:
    restricted_sensor:
      name: The child's "Tablet restricted" sensor
      description: On while a lock runs.
      selector:
        entity:
          filter:
            - integration: lommepenge
              domain: binary_sensor
    block_switch:
      name: Switch that restricts the tablet
      description: >
        On = restricted. E.g. the UniFi integration's switch for a traffic
        rule that blocks entertainment for exactly this tablet.
      selector:
        entity:
          filter:
            - domain: switch

mode: queued
max: 10

variables:
  restricted_sensor: !input restricted_sensor

triggers:
  - trigger: state
    entity_id: !input restricted_sensor
    to: "on"
    id: lock
  - trigger: state
    entity_id: !input restricted_sensor
    to: "off"
    id: unlock
  - trigger: state
    entity_id: !input restricted_sensor
    to: "unavailable"
    for: "00:10:00"
    id: unavailable
  - trigger: homeassistant
    event: start
    id: start

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: lock
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input block_switch

      - conditions:
          - condition: trigger
            id: [unlock, unavailable]
        sequence:
          # unavailable = fail-open: a fault in the system must never
          # punish the child.
          - action: switch.turn_off
            target:
              entity_id: !input block_switch

      - conditions:
          - condition: trigger
            id: start
        sequence:
          # Re-sync after a restart; a lock that ran out while HA was down
          # has already been ended by Lommepenge.
          - action: >
              switch.turn_{{ 'on' if is_state(restricted_sensor, 'on') else 'off' }}
            target:
              entity_id: !input block_switch
