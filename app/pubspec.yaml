name: lommepenge_app
description: "Lommepenge-app til familien - opgaver og godkendelse med Home Assistant som server."
publish_to: 'none'
version: 0.3.1+301

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management (holdt simpelt: ChangeNotifier + provider)
  provider: ^6.1.2

  # Lokal database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  # Ren Dart/FFI-implementering af sqflite til Windows/Linux desktop, hvor
  # den almindelige sqflite-plugin ikke har nogen native implementering
  # (se DatabaseHelper.initializeFactory). Var tidligere kun en
  # dev_dependency til tests, men skal nu også med i selve app-builden.
  sqflite_common_ffi: ^2.3.4

  # Lokale indstillinger (rolle, pin-hash, forbindelse til Home Assistant)
  shared_preferences: ^2.3.2

  # Id-generering
  uuid: ^4.5.1

  # Signering af kald til Home Assistant (HMAC-SHA256) og tjek af opdateringer
  crypto: ^3.0.5

  # Scanning af QR-koden fra "Tilføj enhed" i Home Assistant
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
