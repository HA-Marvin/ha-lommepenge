name: lommepenge_app
description: "Lommepenge app for the family - tasks and approval with Home Assistant as the server."
publish_to: 'none'
version: 0.4.1+401

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # Translations (English, Danish, German, Spanish, French) - see l10n.yaml
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI
  cupertino_icons: ^1.0.8

  # State management (kept simple: ChangeNotifier + provider)
  provider: ^6.1.2

  # Temporary folder for downloaded updates
  path_provider: ^2.1.4

  # Local settings (role, PIN hash, connection to Home Assistant, language)
  shared_preferences: ^2.3.2

  # Id generation
  uuid: ^4.5.1

  # Signing of requests to Home Assistant (HMAC-SHA256) and update checks
  crypto: ^3.0.5

  # Scanning the QR code from "Add device" in Home Assistant
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
